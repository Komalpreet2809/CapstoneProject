[project]
name = "gateway"
version = "0.1.0"
description = "VoiceServe realtime audio gateway: LiveKit transport, VAD, end-of-turn, barge-in"
requires-python = ">=3.11,<3.12"
dependencies = [
  "voiceserve-common",
  "uvicorn[standard]>=0.38",
  "livekit-agents>=1.8",
  "livekit-plugins-deepgram>=1.8",
  "livekit-plugins-silero>=1.8",
  "livekit-api>=1.2",
  "httpx>=0.28",
]

[tool.uv.sources]
voiceserve-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"
