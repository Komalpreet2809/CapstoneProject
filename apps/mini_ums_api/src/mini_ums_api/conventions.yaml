# Mini UMS conventions: every format, policy, category and menu entry in one place.
#
# Placeholders until the real formats and menu land in docs/reference/. Changing a format
# here (and re-seeding) is meant to be the only change needed.
# Served read-only at GET /catalogue/* so the web app and the agent use the same data.

version: 1

ids:
  reg_no:
    pattern: "^[0-9]{8}$"
    example: "24100001"
    note: 2-digit intake year + 6-digit serial (placeholder)
  vid:
    pattern: "^V[0-9]{5}$"
    example: "V40213"
    note: display-only virtual ID shown in the top bar (placeholder)
  section:
    example: "K24CS1"
    note: campus letter + intake year + programme code + section number (placeholder)
  ticket_number:
    sequence_digits: 4
    check_digit: damm
    note: 4-digit sequence + 1 Damm check digit; the voice agent reads it digit by digit
  request_id:
    format: "{dept}/{month}-{yy}/{number}"
    example: "HST/Nov-26/10019"

policies:
  attendance_min_percent: 75
  password_max_age_days: 90
  login_max_failures: 5
  login_lockout_minutes: 15
  session_hours: 8
  hostel_leave_max_days: 30
  placement_remind_later_hours: 24

programmes:
  - {code: CS, name: "B.Tech. Computer Science and Engineering", school: School of Computing}
  - {code: EC, name: "B.Tech. Electronics and Communication Engineering", school: School of Electronics}
  - {code: ME, name: "B.Tech. Mechanical Engineering", school: School of Mechanical Sciences}
  - {code: BB, name: "BBA (Business Administration)", school: School of Business}
  - {code: BS, name: "B.Sc. (Hons.) Data Science", school: School of Computing}

hostel_blocks:
  boys: [BH-1, BH-2, BH-3, BH-4, BH-5, BH-6]
  girls: [GH-1, GH-2, GH-3, GH-4]

rms:
  declarations:
    version: "2026-11"
    items:
      - The information I give in this request is true and complete to the best of my knowledge.
      - I will raise one issue per request and choose the category that matches it, so it reaches the right department.
      - I understand that staff may contact me, or visit the location I mention, to resolve this request.
      - I will not use the request system for false complaints, abusive language or matters unrelated to university services.
      - I understand that my request and its status are recorded in RMS History, and that a closed request can be reopened only through feedback.
  categories:
    - id: HOSTEL
      label: Hostel
      dept: HST
      needs_location: true
      sub_categories: [Electrical, Plumbing, Carpentry, Housekeeping, Furniture, Water Cooler, Pest Control]
    - id: IT
      label: IT Services
      dept: ITS
      needs_location: true
      sub_categories: [Wi-Fi, LAN Port, UMS Login, University Email, Software Installation]
    - id: ACADEMIC
      label: Academic
      dept: ACD
      needs_location: false
      sub_categories: [Marks Discrepancy, Attendance Discrepancy, Timetable Clash, Course Registration, Duty Leave]
    - id: EXAMINATION
      label: Examination
      dept: EXM
      needs_location: false
      sub_categories: [Result Discrepancy, Admit Card, Seating Plan, Re-appear Form]
    - id: FEE
      label: Fee and Accounts
      dept: ACC
      needs_location: false
      sub_categories: [Payment Not Updated, Refund, Fee Receipt, Scholarship]
    - id: LIBRARY
      label: Library
      dept: LIB
      needs_location: false
      sub_categories: [Fine Waiver, Book Not Available, Account Issue]
    - id: TRANSPORT
      label: Transport
      dept: TRN
      needs_location: false
      sub_categories: [Bus Pass, Route or Timing, Driver Conduct]
    - id: OTHER
      label: Other
      dept: GEN
      needs_location: false
      sub_categories: [General Query]

