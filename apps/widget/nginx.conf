# Serves the widget bundle from its own origin, the way a real UMS would load a third-party script.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The bundle includes the LiveKit client (~570 KB); compressed it is roughly a quarter.
  gzip on;
  gzip_types application/javascript;
  gzip_min_length 1024;
  gzip_vary on;

  location = /health {
    default_type application/json;
    return 200 '{"status":"ok","service":"widget"}';
  }

  location = /widget.js {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location / {
    return 404;
  }
}
