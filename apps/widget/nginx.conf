# Serves the widget bundle from its own origin, the way a real UMS would load a third-party script.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location = /health {
    default_type application/json;
    return 200 '{"status":"ok","service":"widget"}';
  }

  location = /widget.js {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location / {
    return 404;
  }
}
