; Processes of the all-in-one demo image (D-038). All log to the container's stdout.
; Services that start before their dependencies are ready exit and are restarted.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:postgres]
command=postgres -D /tmp/pgdata -c listen_addresses=127.0.0.1 -k /tmp
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:mini-ums-api]
command=uvicorn mini_ums_api.main:create_app --factory --host 127.0.0.1 --port 8001
priority=20
autorestart=true
startretries=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:orchestrator]
command=uvicorn orchestrator.main:create_app --factory --host 127.0.0.1 --port 8002
priority=30
autorestart=true
startretries=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:gateway]
command=uvicorn gateway.main:create_app --factory --host 127.0.0.1 --port 8003
priority=30
autorestart=true
startretries=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; The voice worker only runs when a LiveKit server is configured (LiveKit Cloud on a Space).
[program:gateway-worker]
command=sh -c 'if [ -n "$LIVEKIT_URL" ]; then exec python -m gateway.worker start; else exec sleep infinity; fi'
priority=40
autorestart=true
startretries=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:web]
command=node /app/web/server.js
directory=/app/web
environment=PORT="3000",HOSTNAME="127.0.0.1",NEXT_TELEMETRY_DISABLED="1"
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:caddy]
command=caddy run --config /app/deploy/Caddyfile --adapter caddyfile
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
