[project]
name = "voiceserve-common"
version = "0.1.0"
description = "Settings, structured logging, log masking and health checks shared by VoiceServe services"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.120",
  "pydantic-settings>=2.6",
  "httpx>=0.28",
  "asyncpg>=0.30",
  "redis>=6",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"
