name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run --all-packages mypy
      - run: uv run --all-packages pytest

  js:
    name: JS (${{ matrix.app }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [mini_ums_web, dashboard, widget]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact --verbose .

  stack:
    name: Compose smoke test
    runs-on: ubuntu-24.04
    needs: [python, js]
    steps:
      - uses: actions/checkout@v7
      - name: Build and start every service
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke checks
        run: python3 scripts/smoke.py --wait 30
      - name: Show state on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
