name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    # API tests run against a real Postgres; REQUIRE_DB makes them fail rather than skip.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: voiceserve
          POSTGRES_PASSWORD: voiceserve
          POSTGRES_DB: voiceserve
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U voiceserve -d voiceserve"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run --all-packages mypy
      - run: uv run --all-packages pytest

  js:
    name: JS (${{ matrix.app }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [mini_ums_web, dashboard, widget]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact --verbose .

  stack:
    name: Compose smoke and browser tests
    runs-on: ubuntu-24.04
    needs: [python, js]
    # Replay mode: recorded transcripts and intents, no paid providers, so the voice test runs.
    env:
      REPLAY_MODE: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Build and start every service
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke checks
        run: python3 scripts/smoke.py --wait 30
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/mini_ums_web/package-lock.json
      - name: Install browser tests
        working-directory: apps/mini_ums_web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser tests (fresh seed)
        run: |
          docker compose exec -T mini-ums-api python -m mini_ums_api.seed
          npm --prefix apps/mini_ums_web run e2e
      - name: Show state on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
